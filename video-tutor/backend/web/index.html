<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Tutor</title>
  <link rel="stylesheet" href="/coach.css">
  <style>
    :root { --bg: #f5f6f8; --fg: #16181d; --muted: #5d6470; --line: #d9dce2; }
    @media (prefers-color-scheme: dark) { :root { --bg: #121418; --fg: #eceef2; --muted: #a3a9b5; --line: #343841; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; padding-right: 380px; }
    h1 { margin: 0 0 4px; font-size: 22px; }
    p.lead { margin: 0 0 16px; color: var(--muted); }
    .picker { display: inline-flex; gap: 8px; align-items: center; padding: 10px 14px; border: 1px dashed var(--line); border-radius: 10px; cursor: pointer; }
    video { display: block; width: 100%; max-height: 75vh; margin-top: 16px; background: #000; border-radius: 10px; }
    @media (max-width: 700px) { main { padding-right: 16px; padding-bottom: 55vh; } }
  </style>
</head>
<body>
  <main>
    <h1>Video Tutor</h1>
    <p class="lead">Pick a video file, press “Explain this video”, then watch together. On YouTube, use the Chrome extension instead.</p>
    <label class="picker">📁 <span>Choose a video…</span><input id="file" type="file" accept="video/*" hidden></label>
    <video id="video" controls playsinline hidden></video>
  </main>
  <script src="/coach-ui.js"></script>
  <script>
    (function startUploadPage() {
      const fileInput = document.getElementById("file");
      const video = document.getElementById("video");
      let coach = null;
      let fileName = "";

      async function postJson(path, payload) {
        const response = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload) });
        const body = await response.json().catch(function badJson() { return {}; });
        if (!response.ok) throw new Error(body.error || `Backend error ${response.status}`);
        return body;
      }

      const api = {
        analyze: function analyze(payload) { return postJson("/api/analyze", payload); },
        ask: function ask(payload) { return postJson("/api/ask", payload); },
      };

      fileInput.addEventListener("change", function onFilePicked() {
        const file = fileInput.files[0];
        if (!file) return;
        fileName = file.name;
        fileInput.previousElementSibling.textContent = file.name;
        video.src = URL.createObjectURL(file);
        video.hidden = false;
        if (coach) coach.destroy();
        coach = VideoTutor.createCoach({
          video,
          api,
          title: function uploadTitle() { return fileName; },
          getTranscript: null,
          mount: function mountPanel(panel) { document.body.append(panel); },
          language: "en",
        });
      });
    })();
  </script>
</body>
</html>
